# MileWatch PL - konfiguracja zrodel i profilu uzytkownika
#
# Wszystkie adresy zweryfikowane na zywo. RSS jest preferowany (lekki); jedno zrodlo
# typu "scrape" pobiera HTML strony kategorii (robots.txt na to pozwala).
#
# Jak to dziala: zrodla niemieckie/angielskie sa CELOWANE na Miles & More (M&M to program
# Lufthansy, wiec najwiecej tresci jest po niemiecku). Zrodla polskie sa ogolnie podrozne -
# filtr w extract.py przepuszcza z nich tylko wpisy dotyczace Miles & More, reszte odrzuca.
#
# Uwaga: Reisetopia i oficjalna strona miles-and-more.com zostaly usuniete - Reisetopia
# blokuje skrypty (Cloudflare 403), a strona M&M laduje oferty przez JavaScript.

sources:
  # --- Zrodla celowane na Miles & More (DE/EN) ---
  - name: "InsideFlyer.de (Miles & More)"
    type: rss
    url: "https://insideflyer.de/tag/miles-more/feed/"
    enabled: true

  - name: "InsideFlyer.com (Miles & More)"
    type: rss
    url: "https://insideflyer.com/tag/miles-more/feed/"
    enabled: true

  - name: "Meilenoptimieren.com"
    type: rss
    url: "https://meilenoptimieren.com/feed/"
    enabled: true

  - name: "Frankfurtflyer.de"
    type: rss
    url: "https://frankfurtflyer.de/feed/"
    enabled: true

  - name: "Travel-Dealz.de"
    type: rss
    url: "https://travel-dealz.de/feed/"
    enabled: true

  # --- Zrodla polskie (ogolnie podrozne; filtr wybiera wpisy o Miles & More) ---
  - name: "Mleczne Podroze"
    type: rss
    url: "https://mlecznepodroze.pl/feed/"
    enabled: true

  - name: "Fly4free.pl"
    type: rss
    url: "https://www.fly4free.pl/feed/"
    enabled: true

  - name: "InsideFlyer.de (ogolny)"
    type: rss
    url: "https://insideflyer.de/feed/"
    enabled: true

  # --- Dodatkowe zrodla polskie ---
  - name: "Masa Perlowa"
    type: rss
    url: "https://www.masaperlowa.pl/feed/"
    enabled: true

  - name: "Subiektywnie o Finansach"
    type: rss
    url: "https://subiektywnieofinansach.pl/feed/"
    enabled: true

  - name: "Travelfree"
    type: rss
    url: "https://travelfree.info/feed/"
    enabled: true

  # --- Zrodla zagraniczne (EN; perelki spoza regionu sa de-priorytetyzowane w Fazie 1) ---
  - name: "One Mile at a Time"
    type: rss
    url: "https://onemileatatime.com/feed/"
    enabled: true

  - name: "Frequent Miler"
    type: rss
    url: "https://frequentmiler.com/feed/"
    enabled: true

  - name: "Thrifty Traveler"
    type: rss
    url: "https://thriftytraveler.com/feed/"
    enabled: true

  - name: "View from the Wing"
    type: rss
    url: "https://viewfromthewing.com/feed/"
    enabled: true

  # Ponizsze WYLACZONE - zweryfikowane jako niedzialajace (czerwiec 2026):
  #  * punktozercy.pl, mile.pl - domena nie istnieje (DNS getaddrinfo failed),
  #  * FlyerTalk - blokuje boty (HTTP 403).
  # Jesli znasz poprawny adres feedu, popraw url i ustaw enabled: true.
  - name: "Punktozercy"
    type: rss
    url: "https://punktozercy.pl/feed/"
    enabled: false

  - name: "Mile.pl"
    type: rss
    url: "https://mile.pl/feed/"
    enabled: false

  - name: "FlyerTalk - Miles & More"
    type: rss
    url: "https://www.flyertalk.com/forum/external.php?type=RSS2&forumids=251"
    enabled: false

  # --- Zrodla perelek: bledy cenowe / tania biznes klasa (filtr deals.py) ---
  - name: "The Flight Deal"
    type: rss
    url: "https://www.theflightdeal.com/feed/"
    enabled: true

  # --- Scraping HTML (robots.txt zrodel na to pozwala) ---
  - name: "InsideFlyer.de - kategoria M&M (scrape)"
    type: scrape
    url: "https://insideflyer.de/tag/miles-more/"
    enabled: true

  - name: "Pasazer.com - Miles & More (scrape)"
    type: scrape
    url: "https://www.pasazer.com/tag/miles-more"
    enabled: true

# Profil uzytkownika - okresla ktore promocje Miles & More sa wyrozniane jako "Twoje".
#
# Uwaga: kategorie "perelki" (error_fare = jawne bledy cenowe, great_deal = tani lot/mega,
# business_class = tania klasa biznes) sa ZAWSZE alertowane, niezaleznie od tego profilu.
# Progi cenowe oraz FILTR LOTNISK WYLOTU (Polska + kraje oscienne) ustawisz w deals.py
# (DEFAULT: mega <=1500 zl/350 EUR, biznes <=4000 zl/900 EUR; PREFERRED_DEP = lista wylotow).
profile:
  typy_promocji:
    - buy_miles
    - mileage_bargain
    - partner_bonus
  partnerzy:
    - "Lufthansa"
    - "LOT"
    - "Hertz"
    - "Marriott"
  regiony:
    - "Europa"
    - "Polska"
  trasy: []
  min_bonus_pct: 20
