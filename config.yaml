# MileWatch PL - konfiguracja zrodel i profilu uzytkownika
#
# Wszystkie adresy zweryfikowane na zywo. RSS jest preferowany (lekki); jedno zrodlo
# typu "scrape" pobiera HTML strony kategorii (robots.txt na to pozwala).
#
# Jak to dziala: zrodla niemieckie/angielskie sa CELOWANE na Miles & More (M&M to program
# Lufthansy, wiec najwiecej tresci jest po niemiecku). Zrodla polskie sa ogolnie podrozne -
# filtr w extract.py przepuszcza z nich tylko wpisy dotyczace Miles & More, reszte odrzuca.
#
# Uwaga: Reisetopia i oficjalna strona miles-and-more.com zostaly usuniete - Reisetopia
# blokuje skrypty (Cloudflare 403), a strona M&M laduje oferty przez JavaScript.

sources:
  # --- Zrodla celowane na Miles & More (DE/EN) ---
  - name: "InsideFlyer.de (Miles & More)"
    type: rss
    url: "https://insideflyer.de/tag/miles-more/feed/"
    enabled: true

  - name: "InsideFlyer.com (Miles & More)"
    type: rss
    url: "https://insideflyer.com/tag/miles-more/feed/"
    enabled: true

  - name: "Meilenoptimieren.com"
    type: rss
    url: "https://meilenoptimieren.com/feed/"
    enabled: true

  - name: "Frankfurtflyer.de"
    type: rss
    url: "https://frankfurtflyer.de/feed/"
    enabled: true

  - name: "Travel-Dealz.de"
    type: rss
    url: "https://travel-dealz.de/feed/"
    enabled: true

  # --- Zrodla polskie (ogolnie podrozne; filtr wybiera wpisy o Miles & More) ---
  - name: "Mleczne Podroze"
    type: rss
    url: "https://mlecznepodroze.pl/feed/"
    enabled: true

  - name: "Fly4free.pl"
    type: rss
    url: "https://www.fly4free.pl/feed/"
    enabled: true

  - name: "InsideFlyer.de (ogolny)"
    type: rss
    url: "https://insideflyer.de/feed/"
    enabled: true

  # --- Dodatkowe zrodla polskie ---
  - name: "Masa Perlowa"
    type: rss
    url: "https://www.masaperlowa.pl/feed/"
    enabled: true

  - name: "Subiektywnie o Finansach"
    type: rss
    url: "https://subiektywnieofinansach.pl/feed/"
    enabled: true

  - name: "Travelfree"
    type: rss
    url: "https://travelfree.info/feed/"
    enabled: true

  # --- Zrodla zagraniczne (EN; perelki spoza regionu sa de-priorytetyzowane w Fazie 1) ---
  - name: "One Mile at a Time"
    type: rss
    url: "https://onemileatatime.com/feed/"
    enabled: true

  - name: "Frequent Miler"
    type: rss
    url: "https://frequentmiler.com/feed/"
    enabled: true

  - name: "Thrifty Traveler"
    type: rss
    url: "https://thriftytraveler.com/feed/"
    enabled: true

  - name: "View from the Wing"
    type: rss
    url: "https://viewfromthewing.com/feed/"
    enabled: true

  # Ponizsze WYLACZONE - zweryfikowane jako niedzialajace (czerwiec 2026):
  #  * punktozercy.pl, mile.pl - domena nie istnieje (DNS getaddrinfo failed),
  #  * FlyerTalk - blokuje boty (HTTP 403).
  # Jesli znasz poprawny adres feedu, popraw url i ustaw enabled: true.
  - name: "Punktozercy"
    type: rss
    url: "https://punktozercy.pl/feed/"
    enabled: false

  - name: "Mile.pl"
    type: rss
    url: "https://mile.pl/feed/"
    enabled: false

  - name: "FlyerTalk - Miles & More"
    type: rss
    url: "https://www.flyertalk.com/forum/external.php?type=RSS2&forumids=251"
    enabled: false

  # --- Zrodla perelek: bledy cenowe / tania biznes klasa (filtr deals.py) ---
  - name: "The Flight Deal"
    type: rss
    url: "https://www.theflightdeal.com/feed/"
    enabled: true

  # Tani Locik - polski serwis z tanimi lotami (nie M&M; wartosc: perelki + zlote terminy).
  # Feed RSS /feed/ dawal 404 (zweryfikowane diag.py), wiec scrapujemy strone glowna.
  # Jesli scrape tez da 0 (strona renderowana JS albo robots.txt blokuje), zrodlo mozna
  # wylaczyc - tanibilet.eu pokrywa te sama nisze i dziala.
  - name: "Tani Locik"
    type: scrape
    url: "https://tanilocik.pl/"
    enabled: true

  # Tani Bilet - kolejny polski serwis tanich lotow (nie M&M; wartosc: perelki + zlote terminy).
  # URL feedu = standardowy WordPress /feed/, DO WERYFIKACJI (uruchom `python diag.py`).
  - name: "Tani Bilet"
    type: rss
    url: "https://tanibilet.eu/feed/"
    enabled: true

  # --- Scraping HTML (robots.txt zrodel na to pozwala) ---
  - name: "InsideFlyer.de - kategoria M&M (scrape)"
    type: scrape
    url: "https://insideflyer.de/tag/miles-more/"
    enabled: true

  - name: "Pasazer.com - Miles & More (scrape)"
    type: scrape
    url: "https://www.pasazer.com/tag/miles-more"
    enabled: true

# Profil uzytkownika - okresla ktore promocje Miles & More sa wyrozniane jako "Twoje".
#
# Uwaga: kategorie "perelki" (error_fare = jawne bledy cenowe, great_deal = tani lot/mega,
# business_class = tania klasa biznes) sa ZAWSZE alertowane, niezaleznie od tego profilu.
# Progi cenowe oraz FILTR LOTNISK WYLOTU (Polska + kraje oscienne) ustawisz w deals.py
# (DEFAULT: mega <=1500 zl/350 EUR, biznes <=4000 zl/900 EUR; PREFERRED_DEP = lista wylotow).
profile:
  typy_promocji:
    - buy_miles
    - mileage_bargain
    - partner_bonus
  partnerzy:
    - "Lufthansa"
    - "LOT"
    - "Hertz"
    - "Marriott"
  regiony:
    - "Europa"
    - "Polska"
  trasy: []
  min_bonus_pct: 20
  # Prog jakosci alertu (scoring 0-100, Faza 2). 0 = alarmuj wszystko co istotne.
  # Podnies (np. 55), aby dostawac tylko najlepsze okazje. Orientacyjnie:
  # blad cenowy ~80-90, tania biznes ~62-72, tani lot daleki ~60, kup mile +100% ~70,
  # bonus partnera 50% ~52, wylot zagraniczny: -25 do oceny.
  min_score: 0
  # Faza 3: pobieranie pelnej tresci artykulu dla itemow z cena (dokladniejsza cena/kierunek).
  # Domyslnie false (lekko/szybko). true = wiecej zapytan HTTP, ale dokladniejszy baseline cen.
  pelna_tresc: false

  # --- ZLOTE TERMINY: okna, w ktorych masz urlop i chcesz alerty o dobrych lotach ---
  # Termin to OKRES (od-do), nie sztywna data wylotu. Jesli w tresci oferty wykryjemy termin
  # podrozy (data, zakres dat albo miesiac/miesiace) zachodzacy na ktorekolwiek okno ponizej,
  # oferta jest ZAWSZE alertowana, mocno podbita w scoringu i wyrozniona na gorze listy/strony.
  # Kolejnosc okien = priorytet. Podmien ponizsze PRZYKLADY na swoje realne terminy urlopu.
  #
  # Wskazowka: ustaw pelna_tresc: true (wyzej), by czesciej wykrywac termin podrozy w artykule -
  # krotkie zajawki RSS czesto go nie zawieraja.
  # Twoje okna urlopowe. Kazdy termin ma najblizsze wystapienie + kolejny rok, zeby lapac
  # oferty publikowane z wyprzedzeniem. Raz w roku dopisz kolejny rok (albo usun miniony).
  zlote_terminy:
    # Wakacje (1-30 wrzesnia)
    - nazwa: "Wakacje 2026"
      od: "2026-09-01"
      do: "2026-09-30"
    - nazwa: "Wakacje 2027"
      od: "2027-09-01"
      do: "2027-09-30"
    # Swieta (21 grudnia - 6 stycznia)
    - nazwa: "Swieta 2026/27"
      od: "2026-12-21"
      do: "2027-01-06"
    - nazwa: "Swieta 2027/28"
      od: "2027-12-21"
      do: "2028-01-06"
    # Swieto 11 listopada (6-15 listopada)
    - nazwa: "11 listopada 2026"
      od: "2026-11-06"
      do: "2026-11-15"
    - nazwa: "11 listopada 2027"
      od: "2027-11-06"
      do: "2027-11-15"
    # Majowka (30 kwietnia - 3 maja); majowka 2026 juz minela, wiec od 2027
    - nazwa: "Majowka 2027"
      od: "2027-04-30"
      do: "2027-05-03"
    - nazwa: "Majowka 2028"
      od: "2028-04-30"
      do: "2028-05-03"
