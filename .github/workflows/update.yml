name: Aktualizuj promocje (GitHub Pages)

# Darmowy, automatyczny scraping + alerty + publikacja wspoldzielonej strony.
# Strona jest publikowana bezposrednio na GitHub Pages (BEZ commitowania do galezi),
# dzieki czemu workflow nigdy nie wchodzi w konflikt z Twoimi wlasnymi commitami.
#
# WYMAGANE USTAWIENIE (jednorazowo): Settings -> Pages -> Source: "GitHub Actions".

on:
  schedule:
    - cron: "37 * * * *"  # co godzine o :37 (minuta poza szczytem = mniej opoznien GitHuba).
                          # Inne: "0 6 * * *" = raz dziennie 06:00 UTC, "*/30 * * * *" = co 30 min.
  workflow_dispatch: {}    # reczne uruchomienie z zakladki Actions
  repository_dispatch:     # niezawodny wyzwalacz zewnetrzny (np. darmowy cron-job.org),
    types: [run-now]       # wywoluje: POST /repos/<user>/<repo>/dispatches {"event_type":"run-now"}

permissions:
  contents: read
  pages: write
  id-token: write

# Tylko jeden deploy na raz; nie przerywaj trwajacego.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zaleznosci
        run: pip install -r requirements.txt

      # Cache bazy SQLite miedzy uruchomieniami - dedup i stan "co juz wyslano" sie nie
      # resetuje. Klucz rotacyjny (run_id) + restore-keys: kazdy przebieg ZAPISUJE nowy
      # cache i przywraca najnowszy poprzedni. Dzieki temu NIE musimy commitowac bazy.
      - name: Przywroc baze danych
        uses: actions/cache@v4
        with:
          path: data
          key: milewatch-db-${{ github.run_id }}
          restore-keys: |
            milewatch-db-

      - name: Scraping + generowanie strony + alerty
        # Sekrety sa opcjonalne - ustaw je w repo (Settings -> Secrets and variables ->
        # Actions), aby dostawac alerty Telegram i/lub Signal o nowych promocjach.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SIGNAL_PHONE: ${{ secrets.SIGNAL_PHONE }}
          SIGNAL_API_KEY: ${{ secrets.SIGNAL_API_KEY }}
        run: python publish.py

      - name: Konfiguracja Pages
        uses: actions/configure-pages@v5

      - name: Wyslij strone jako artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publikacja na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
